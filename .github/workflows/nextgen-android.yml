name: NextGen AI - Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nextgen-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PROFILE: production
    steps:
      # Runs before the toolchains are installed; keeps /opt/hostedtoolcache intact.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs=-Xmx6g --no-daemon

      - name: Collect APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/NextGen-AI-${VERSION}-android.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: NextGen-AI-Android
          path: out/*.apk
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ng-${VERSION}-${{ github.run_number }}"
          gh release create "$TAG" out/*.apk \
            --title "NextGen AI Android ${VERSION} (build ${{ github.run_number }})" \
            --notes "NextGen AI Android app (Cherry Studio Mobile ${VERSION} par mabni). APK download kar ke phone mein install karein."
